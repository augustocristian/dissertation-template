name: Build thesis PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rolling release that always carries the PDF built from the default branch.
  # The README badge links here.
  LATEST_TAG: latest-pdf

jobs:
  build:
    name: Compile thesis PDF (XeLaTeX + biber)
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    outputs:
      pdf_name: ${{ steps.name.outputs.pdf_name }}
    steps:
      - name: Install git (for actions/checkout)
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile with XeLaTeX + biber
        # Mirrors the "known-good full rebuild" sequence documented in CLAUDE.md.
        run: |
          rm -f main.aux main.bcf main.bbl main.blg main.log main.toc main.lof main.lot main.lol main.out main.run.xml main.synctex.gz
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          biber main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Check main.log for errors and unresolved references
        run: |
          if grep -n '^! ' main.log; then
            echo "::error::main.log contains LaTeX errors (see above)."
            exit 1
          fi
          if grep -qE "LaTeX Warning: (Reference|Citation) .* undefined" main.log; then
            echo "::error::Undefined references/citations remain after 3 compile passes:"
            grep -E "LaTeX Warning: (Reference|Citation) .* undefined" main.log
            exit 1
          fi

      - name: Name the PDF
        id: name
        # {year}-{school}-{TFG|TFM}-{SurnameName}-{branch}-{commitid}.pdf
        # Year/school/type/author come from main.tex (see the script header).
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          name=$(bash .github/scripts/pdf-name.sh main.tex)
          cp main.pdf "$name"
          echo "pdf_name=$name" >> "$GITHUB_OUTPUT"
          echo "### PDF: \`$name\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PDF
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: thesis-pdf
          path: ${{ steps.name.outputs.pdf_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Link the PDF in the run summary
        run: |
          echo "Download: ${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the default branch's PDF as the rolling "latest-pdf" release, so
  # there is one stable, login-free URL to link to (artifacts need a login and
  # expire). Other branches get no release: their PDF is only the artifact above.
  publish:
    name: Publish latest PDF release
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest-pdf
      cancel-in-progress: false
    steps:
      - name: Download PDF
        uses: actions/download-artifact@v8
        with:
          name: thesis-pdf

      - name: Replace the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PDF: ${{ needs.build.outputs.pdf_name }}
        run: |
          # Delete + recreate (instead of editing) so the tag moves to this commit.
          # The tag stays fixed (stable URL); the title and asset carry the full name.
          gh release delete "$LATEST_TAG" --cleanup-tag --yes || true
          gh release create "$LATEST_TAG" "$PDF" \
            --target "$GITHUB_SHA" \
            --title "${PDF%.pdf}" \
            --notes "File: \`${PDF}\`. Built automatically from \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`; this release is replaced on every push to \`${GITHUB_REF_NAME}\`."
          echo "### Published: https://github.com/${GH_REPO}/releases/tag/${LATEST_TAG}" >> "$GITHUB_STEP_SUMMARY"
